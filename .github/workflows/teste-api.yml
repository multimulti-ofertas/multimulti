name: Teste API Shopee
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEEAPPID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEESECRET }}
        run: python -m robo.teste_api
