name: Gerar ofertas do dia
on:
  schedule:
    - cron: "0 11 * * *"   # 07:00 em Cuiabá
  workflow_dispatch:
    inputs:
      demo:
        description: "Teste com produtos de mentira (não publica nada)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: robo
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Buscar produtos e criar artes
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m robo.gerar ${{ inputs.demo && '--demo' || '' }}
      - name: Baixar resultado do teste
        if: ${{ inputs.demo }}
        uses: actions/upload-artifact@v4
        with: { name: teste-demo, path: docs/media }
      - name: Salvar no repositório
        if: ${{ !inputs.demo }}
        run: |
          git config user.name "robo-multimulti"
          git config user.email "robo@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || git commit -m "Ofertas de $(TZ=America/Cuiaba date +%F)"
          git pull --rebase && git push
  vitrine:
    needs: gerar
    if: ${{ !inputs.demo }}
    uses: ./.github/workflows/pages.yml
