name: Gerar ofertas do dia
on:
  schedule:
    - cron: "25 10 * * *"   # 06:25 em Cuiabá (pronto antes do 1º post das 08:00)
  workflow_dispatch:
    inputs:
      demo:
        description: "Teste com produtos de mentira (não publica nada)"
        type: boolean
        default: false
      so_vitrine:
        description: "Coloca os produtos na vitrine sem postar no Instagram"
        type: boolean
        default: false
      previa:
        description: "Prévia com produtos de verdade (gera as artes para baixar, não publica nada)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: robo
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Buscar produtos e criar artes
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEEAPPID || secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEESECRET || secrets.SHOPEE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m robo.gerar ${{ inputs.demo && '--demo' || '' }} ${{ inputs.so_vitrine && '--so-vitrine' || '' }}
      - name: Baixar resultado do teste
        if: ${{ inputs.demo || inputs.previa }}
        uses: actions/upload-artifact@v4
        with: { name: "${{ inputs.previa && 'previa' || 'teste-demo' }}", path: "docs/media\ndocs/produtos.json" }
      - name: Guardar prévia no ramo "previa" (não aparece na vitrine)
        if: ${{ inputs.previa }}
        run: |
          git config user.name "robo-multimulti"
          git config user.email "robo@users.noreply.github.com"
          git checkout -B previa
          git add -A docs
          git commit -m "Prévia $(TZ=America/Cuiaba date '+%F %H:%M')"
          git push -f origin previa
      - name: Salvar no repositório
        if: ${{ !inputs.demo && !inputs.previa }}
        run: |
          git config user.name "robo-multimulti"
          git config user.email "robo@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || git commit -m "Ofertas de $(TZ=America/Cuiaba date +%F)"
          git pull --rebase && git push
  vitrine:
    needs: gerar
    if: ${{ !inputs.demo && !inputs.previa }}
    uses: ./.github/workflows/pages.yml
