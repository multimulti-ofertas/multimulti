name: Postar no Instagram e Facebook
on:
  schedule:
    # 4x por hora (fora do minuto 0, que é o mais congestionado no GitHub), das 08h às 21h de Cuiabá
    # (12:xx a 01:xx UTC). O robô CONTA o que já saiu no dia e só posta o que falta até a hora atual:
    # rodar várias vezes não duplica, e execução atrasada/pulada é coberta pela seguinte.
    - cron: "2,17,32,47 12-23 * * *"
    - cron: "2,17,32,47 0-1 * * *"
  workflow_dispatch:
    inputs:
      tipo:
        description: "feed, reel ou story"
        required: true
        default: auto
        type: choice
        options: [auto, feed, reel, story]
      so_facebook:
        description: "Só Facebook (põe na Página o que já saiu no Instagram hoje)"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: robo
  cancel-in-progress: false
jobs:
  postar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IGUSERID || secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IGTOKEN || secrets.IG_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FBPAGETOKEN }}
        run: |
          python -m robo.postar --tipo "${{ inputs.tipo || 'auto' }}" ${{ inputs.so_facebook && '--so-facebook' || '' }}
      - name: Marcar como postado
        if: always()   # mesmo se algo falhar, salva o que já foi publicado (evita post repetido)
        run: |
          git config user.name "robo-multimulti"
          git config user.email "robo@users.noreply.github.com"
          git add docs/produtos.json docs/pausa.json 2>/dev/null || git add docs/produtos.json
          git diff --cached --quiet || git commit -m "Postado no Instagram/Facebook"
          git pull --rebase && git push
