name: Postar no Instagram
on:
  schedule:
    - cron: "0 12 * * *"   # 08:00 em Cuiabá → stories
    - cron: "0 16 * * *"   # 12:00 em Cuiabá → feed
    - cron: "0 19 * * *"   # 15:00 em Cuiabá → stories
    - cron: "0 22 * * *"   # 18:00 em Cuiabá → Reels 1
    - cron: "0 0 * * *"    # 20:00 em Cuiabá → stories
    - cron: "0 1 * * *"    # 21:00 em Cuiabá → Reels 2
  workflow_dispatch:
    inputs:
      tipo:
        description: "feed, reel ou story"
        required: true
        default: feed
        type: choice
        options: [feed, reel, story]
permissions:
  contents: write
concurrency:
  group: robo
  cancel-in-progress: false
jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IGUSERID || secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IGTOKEN || secrets.IG_TOKEN }}
        run: |
          TIPO="${{ inputs.tipo }}"
          if [ -z "$TIPO" ]; then
            case "${{ github.event.schedule }}" in
              "0 16 * * *") TIPO=feed ;;
              "0 22 * * *"|"0 1 * * *") TIPO=reel ;;
              *) TIPO=story ;;
            esac
          fi
          python -m robo.postar --tipo "$TIPO"
      - name: Marcar como postado
        run: |
          git config user.name "robo-multimulti"
          git config user.email "robo@users.noreply.github.com"
          git add docs/produtos.json
          git diff --cached --quiet || git commit -m "Postado no Instagram"
          git pull --rebase && git push
