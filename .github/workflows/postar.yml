name: Postar no Instagram
on:
  schedule:
    # Rotina: roda de hora em hora, uns minutos antes da hora cheia (o GitHub costuma atrasar),
    # das 07:50 às 21:50 em Cuiabá (11:50 a 01:50 UTC). O que postar em cada hora está em robo/config.py → ROTINA.
    - cron: "50 11-23 * * *"
    - cron: "50 0-1 * * *"
  workflow_dispatch:
    inputs:
      tipo:
        description: "feed, reel ou story"
        required: true
        default: auto
        type: choice
        options: [auto, feed, reel, story]
permissions:
  contents: write
concurrency:
  group: robo
  cancel-in-progress: false
jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IGUSERID || secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IGTOKEN || secrets.IG_TOKEN }}
        run: |
          python -m robo.postar --tipo "${{ inputs.tipo || 'auto' }}"
      - name: Marcar como postado
        run: |
          git config user.name "robo-multimulti"
          git config user.email "robo@users.noreply.github.com"
          git add docs/produtos.json
          git diff --cached --quiet || git commit -m "Postado no Instagram"
          git pull --rebase && git push
