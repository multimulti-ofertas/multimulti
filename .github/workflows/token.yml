name: Renovar token do Instagram
on:
  schedule:
    - cron: "0 10 * * 1"   # toda segunda
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renovar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          IG_USER_ID: ${{ secrets.IGUSERID || secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IGTOKEN || secrets.IG_TOKEN }}
        run: python -m robo.token
      - name: Salvar token novo nos Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::Sem GH_PAT: o token do Instagram NÃO foi salvo (vence em 60 dias)."; exit 0; fi
          gh secret set IGTOKEN --repo "${{ github.repository }}" < novo_token.txt
          rm -f novo_token.txt
          echo "::notice::Token do Instagram renovado e salvo no secret IGTOKEN."
