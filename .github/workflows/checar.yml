name: Checar Instagram
on:
  workflow_dispatch:
jobs:
  checar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          IG_USER_ID: ${{ secrets.IGUSERID || secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IGTOKEN || secrets.IG_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FBPAGETOKEN }}
        run: python -m robo.checar
