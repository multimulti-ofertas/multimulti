name: Top 3 da semana
on:
  schedule:
    - cron: "0 11 * * 6"   # sábado 07:00 em Cuiabá
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: robo
  cancel-in-progress: false
jobs:
  video:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Baixar mídias (ramo midia)
        run: bash .github/midia.sh baixar
      - name: Montar o vídeo
        run: python -m robo.top3
      - name: Salvar
        run: |
          git config user.name "robo-multimulti"
          git config user.email "robo@users.noreply.github.com"
          git add docs/semana
          git diff --cached --quiet || git commit -m "Top 3 da semana $(TZ=America/Cuiaba date +%F)"
          git pull --rebase && git push
  vitrine:
    needs: video
    uses: ./.github/workflows/pages.yml
