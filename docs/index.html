<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiMulti Achadinhos</title>
<meta name="description" content="Os achadinhos masculinos mais vendidos da Shopee: carro, ferramentas, cuidado e estilo.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ff6b1a'/><text x='50' y='66' font-size='46' text-anchor='middle' font-family='Arial' font-weight='bold' fill='%23111'>MM</text></svg>">
<style>
  :root{--or:#ff6b1a;--bk:#111;--bg:#0b0b0b;--card:#1a1a1a;--tx:#f4f4f4;--mut:#a0a0a0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  header{background:var(--bk);border-bottom:4px solid var(--or);padding:18px 16px 14px;text-align:center;position:sticky;top:0;z-index:2}
  .logo{font-weight:900;font-size:30px;letter-spacing:-1px;font-stretch:condensed}
  .logo span{color:var(--or)}
  .sub{color:var(--mut);font-size:13px;margin-top:2px}
  .busca{margin:12px auto 0;max-width:520px;display:flex;gap:8px}
  .busca input{flex:1;padding:12px 14px;border-radius:10px;border:2px solid #333;background:#151515;color:var(--tx);font-size:16px}
  .busca input:focus{outline:none;border-color:var(--or)}
  main{max-width:560px;margin:0 auto;padding:16px}
  .dia{color:var(--or);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:22px 4px 10px}
  .card{display:flex;gap:12px;background:var(--card);border-radius:14px;padding:10px;margin-bottom:12px;text-decoration:none;color:inherit;border:2px solid transparent;transition:border-color .15s}
  .card:hover,.card.alvo{border-color:var(--or)}
  .foto{position:relative;flex:0 0 112px;height:112px;border-radius:10px;background:#fff;overflow:hidden}
  .foto img{width:100%;height:100%;object-fit:contain}
  .num{position:absolute;top:6px;left:6px;background:var(--bk);color:#fff;font-weight:900;font-size:13px;padding:3px 7px;border-radius:6px}
  .info{flex:1;min-width:0;display:flex;flex-direction:column}
  .tit{font-weight:700;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{color:var(--mut);font-size:12px;margin-top:4px}
  .preco{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:6px}
  .preco b{font-size:20px}
  .off{background:var(--or);color:var(--bk);font-weight:900;font-size:12px;padding:2px 6px;border-radius:5px}
  .btn{margin-top:8px;background:var(--or);color:var(--bk);font-weight:900;text-align:center;padding:9px;border-radius:9px;font-size:14px}
  .vazio{color:var(--mut);text-align:center;padding:40px 10px}
  footer{color:var(--mut);font-size:12px;text-align:center;padding:24px 16px 40px;line-height:1.5}
  footer a{color:var(--or)}
</style>
</head>
<body>
<header>
  <div class="logo">MULTI<span>MULTI</span></div>
  <div class="sub">Achadinhos masculinos da Shopee · toque e compre</div>
  <div class="busca"><input id="q" inputmode="search" placeholder="Digite o nº do produto ou o nome" autocomplete="off"></div>
</header>
<main id="lista"><div class="vazio">Carregando ofertas…</div></main>
<footer>
  Links de afiliado: você paga o mesmo preço e ajuda o MultiMulti a continuar postando.<br>
  Preços e estoque podem mudar a qualquer momento.<br>
  <a href="https://instagram.com/multimulti.ofertas">@multimulti.ofertas</a>
</footer>
<script>
const $ = s => document.querySelector(s);
let itens = [];
const fmtDia = iso => {
  const d = new Date(iso + "T12:00:00");
  const hoje = new Date(); hoje.setHours(12,0,0,0);
  const diff = Math.round((hoje - d) / 864e5);
  if (diff === 0) return "Hoje";
  if (diff === 1) return "Ontem";
  return d.toLocaleDateString("pt-BR", {weekday:"long", day:"2-digit", month:"2-digit"});
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
  const q = $("#q").value.trim().toLowerCase().replace(/^n[ºo°]?\s*/, "");
  if (!itens.length){ $("#lista").innerHTML = '<div class="vazio"><b style="color:var(--tx);font-size:17px">🔥 As primeiras ofertas chegam em breve!</b><br><br>Todo dia tem achadinho novo por aqui.<br>Siga <a href="https://instagram.com/multimulti.ofertas" style="color:var(--or)">@multimulti.ofertas</a> pra não perder.</div>'; return; }
  const soNumero = /^\d+$/.test(q);
  const lista = itens.filter(x => !q || (soNumero ? String(x.n) === q : x.titulo.toLowerCase().includes(q)));
  if (!lista.length){ $("#lista").innerHTML = `<div class="vazio">${soNumero ? `Não achei o produto nº ${esc(q)}.<br>Ele pode ter saído da vitrine. Apague a busca para ver todos.` : "Nenhum produto encontrado."}</div>`; return; }
  let html = "", dia = "";
  for (const x of lista){
    if (x.data !== dia){ dia = x.data; html += `<div class="dia">${esc(fmtDia(dia))}</div>`; }
    html += `<a class="card${String(x.n)===q?" alvo":""}" href="${esc(x.link)}" target="_blank" rel="noopener sponsored">
      <div class="foto"><img src="${esc(x.imagem)}" alt="" loading="lazy"><span class="num">Nº ${x.n}</span></div>
      <div class="info">
        <div class="tit">${esc(x.titulo)}</div>
        <div class="meta">⭐ ${esc(x.nota)} · ${esc(x.vendidos)} vendidos</div>
        <div class="preco"><b>${esc(x.preco)}</b>${x.pct>0?`<span class="off">${x.pct}% OFF</span>`:""}</div>
        <div class="btn">🛒 Ver na Shopee</div>
      </div></a>`;
  }
  $("#lista").innerHTML = html;
}
fetch("produtos.json?v=" + Date.now()).then(r => r.ok ? r.json() : []).then(j => {
  itens = j; render();
}).catch(() => { $("#lista").innerHTML = '<div class="vazio">Não consegui carregar as ofertas. Tente de novo.</div>'; });
$("#q").addEventListener("input", render);
const p = new URLSearchParams(location.search).get("n");
if (p) $("#q").value = p;
</script>
</body>
</html>
